name: Build and Publish Front End Framework Website

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  Angular-Build-Action:
    name: Angular-Build-Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Use Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build Project
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Tag strategy (derived from the git ref, never from the pom):
      #   PR                 -> build only, nothing pushed
      #   push to main       -> edge, sha-<short>
      #   tag v6.0.0-beta.1  -> 6.0.0-beta.1, beta
      #   tag v6.0.0         -> 6.0.0, 6.0, 6, latest
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            snellocms/snello-admin
            ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}

      - name: Build and push multi-platform
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          platforms: linux/amd64,linux/arm64
          file: ./docker/Dockerfile-local
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      # The snello all-in-one image (snello-api) bundles this admin, copied from the admin image when it is built.
      # snello-api builds only on its own pushes, so an admin-only change never reached it, and a snello-api build
      # running at the same time as this one could still pick the previous admin (2026-11-18). Rebuild it now,
      # pinned to the image just pushed (sha-<short>, not edge). snello-api queues its builds per branch.
      # Needs secret SNELLO_API_DISPATCH_TOKEN: fine-grained token on snello-cms/snello-api, "Actions: read and write".
      # Optional repo variable SNELLO_API_BRANCH (default 6.0.0-alpha): the snello-api branch whose image to rebuild.
      - name: Rebuild snello all-in-one with this admin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.SNELLO_API_DISPATCH_TOKEN }}
          API_REPO: snello-cms/snello-api
          API_BRANCH: ${{ vars.SNELLO_API_BRANCH || '6.0.0-alpha' }}
        run: |
          ADMIN_IMAGE="snellocms/snello-admin:sha-${GITHUB_SHA::7}"
          echo "admin image ${ADMIN_IMAGE} -> ${API_REPO}@${API_BRANCH} build_jvm.yml (snello-all-in-one)"
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::secret SNELLO_API_DISPATCH_TOKEN not set: snello all-in-one NOT rebuilt with this admin"
            exit 0
          fi
          gh workflow run build_jvm.yml -R "${API_REPO}" --ref "${API_BRANCH}" \
            -f images=snello-all-in-one \
            -f admin_image="${ADMIN_IMAGE}" \
            -f reason="snello-admin ${GITHUB_SHA::7} pushed to main"
          echo "requested: https://github.com/${API_REPO}/actions/workflows/build_jvm.yml"
