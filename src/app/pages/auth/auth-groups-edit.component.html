<sidebar></sidebar>
<div class="sidebar">
  <adminhome-topbar></adminhome-topbar>
</div>

<div class="sidebar-subpage">
  <h3>{{ editMode ? 'Edit Group' : 'New Group' }}</h3>
  <p>Authentication &amp; Authorization</p>
</div>

<div class="main">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12 col-sm-12">
        <div class="content view">
          <div class="row">
            <div class="col-md-12 col-sm-12">

              <div class="form-group clearfix row">
                <label class="label-text col-sm-3">Name</label>
                <div class="col-sm-9">
                  <input [(ngModel)]="element.name" type="text" class="form-control"
                    placeholder="Group name" pInputText>
                </div>
              </div>

              <div class="form-group clearfix row">
                <label class="label-text col-sm-3">Path</label>
                <div class="col-sm-9">
                  <input [(ngModel)]="element.path" type="text" class="form-control"
                    placeholder="Path" pInputText>
                </div>
              </div>

              <div class="btn-group btn-actions pull-right">
                @if (!editMode) {
                  <button type="button" (click)="save()" class="btn btn-success">Save</button>
                }
                @if (editMode) {
                  <button type="button" (click)="update()" class="btn btn-success">Update</button>
                }
                <a [routerLink]="'/auth-groups/list'" class="btn btn-default">Cancel</a>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
