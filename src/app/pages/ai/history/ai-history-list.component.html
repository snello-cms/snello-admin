<sidebar></sidebar>
<div class="sidebar">
  <adminhome-topbar></adminhome-topbar>
</div>

<div class="sidebar-subpage">
  <h3>
    Chat history
  </h3>
</div>

<div class="main">

  <div class="container-fluid">
    <div class="row">

      <div class="col-md-12 col-sm-12">
        <ai-nav></ai-nav>
        <div class="content list">

          <form>

            <div class="row">
              <div class="clearfix"></div>
              <div class="col-sm-12">

                <div class="filter-wrapper" (keydown.enter)="onSearchEnter($event, datatable)">
                  <div class="fw-search-fields">
                    @if (service.search) {
                      <p-select id="user" name="user" [style]="{'width':'100%'}" placeholder="user" [filter]="true"
                        [options]="userOptions" [(ngModel)]="service.search.user_id" (onChange)="reload(datatable)">
                      </p-select>
                    }
                  </div>
                  <div class="fw-search-fields">
                    @if (service.search) {
                      <input id="session" name="session" type="text" class="form-control"
                        placeholder="session id" [(ngModel)]="service.search.session_id_contains" pInputText>
                    }
                  </div>
                  <div class="fw-actions">
                    <div class="btn-group">
                      <button type="button" class="btn btn-search" (click)="reload(datatable)">Search</button>
                      <button type="button" class="btn btn-reset" (click)="reset(datatable)">Undo</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="table-wrapper clearfix">

              <p-table #datatable (onLazyLoad)="lazyLoad($event)" [lazy]="true" [paginator]="true" [resizableColumns]="true" [rows]="10" [totalRecords]="service.listSize" [value]="model">
                <ng-template let-columns pTemplate="header">
                  <tr class="sort-header">
                    <th pResizableColumn>Index</th>
                    <th pResizableColumn>Started</th>
                    <th pResizableColumn>User</th>
                    <th pResizableColumn>Session</th>
                    <th pResizableColumn>Messages</th>
                    <th class="Operations">Operations</th>
                  </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                  <tr>
                    <td colspan="6">
                      No conversations.
                    </td>
                  </tr>
                </ng-template>
                <ng-template let-rowData let-rowIndex="rowIndex" pTemplate="body">
                  <tr>
                    <td class="RowIndex">{{ rowIndex + 1 }}</td>
                    <td class="ui-resizable-column">{{rowData.started_at | date:'yyyy-MM-dd HH:mm'}}</td>
                    <td class="ui-resizable-column">{{username(rowData.user_id)}}</td>
                    <td class="ui-resizable-column"><code>{{rowData.session_id}}</code></td>
                    <td class="ui-resizable-column">{{rowData.message_count}}</td>
                    <td>
                      <button type="button" (click)="view(rowData)" class="btn btn-success btn-sm">
                        <i aria-hidden="true" class="fa fa-comments"></i>
                        Transcript
                      </button>
                    </td>
                  </tr>
                </ng-template>
              </p-table>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
